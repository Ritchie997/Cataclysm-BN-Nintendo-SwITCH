name: Nintendo Switch Build

on:
  push:
    branches:
      - main
      - switch-port
      - switch*
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
  pull_request:
    branches:
      - main
      - switch-port
  workflow_dispatch:

jobs:
  build-switch:
    name: Build Nintendo Switch NRO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with devkitPro switch-portlibs
        uses: devkitpro/actions/switch-portlibs@master
        with:
          run: |
            apt-get update && apt-get install -y python3 python3-pip gettext zip
            cmake -B build-switch \
              -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DTILES=ON \
              -DSOUND=OFF \
              -DLOCALIZE=OFF \
              -DTESTS=OFF
            cmake --build build-switch --target CataclysmBN-nro -j$(nproc)
            mkdir -p package/CataclysmBN
            cp build-switch/CataclysmBN.nro package/CataclysmBN/
            cp -r data package/CataclysmBN/
            cp -r gfx package/CataclysmBN/
            cd package
            zip -r ../CataclysmBN-Switch.zip CataclysmBN
            cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CataclysmBN-Switch
          path: CataclysmBN-Switch.zip
          retention-days: 14
